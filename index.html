:root {
  --bg-page: #F6F3EC;
  --bg-surface: #FCFBF8;
  --bg-beige: #ECE6D9;
  --text-main: #1F211E;
  --text-muted: #5F625B;

  --olive-soft: rgba(74, 93, 59, 0.10);
  --border: #D8D3C6;

  --ok: #3B5E38;
  --ok-bg: #E6EFE4;
  --err: #8E3228;
  --err-bg: #F6E6E4;
  --warn: #826222;
  --warn-bg: #F5EFE0;

  --font-en: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-serif: 'Source Serif 4', Georgia, serif;
  --font-ar: 'Cairo', 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --radius: 6px;
  --shadow: 0 1px 3px rgba(31, 33, 30, 0.06);
  --nav-h: 64px;
}

[data-theme="dark"] {
  --bg-page: #181917;
  --bg-surface: #232522;
  --bg-beige: #2C2F2B;
  --text-main: #F3EFE6;
  --text-muted: #B3AEA2;
  --olive: #8FA67B;
  --olive-hover: #799066;
  --olive-soft: rgba(143, 166, 123, 0.14);
  --border: #363934;

  --ok: #8FB88A;
  --ok-bg: rgba(59, 94, 56, 0.34);
  --err: #E68F86;
  --err-bg: rgba(142, 50, 40, 0.30);
  --warn: #DFBE77;
  --warn-bg: rgba(130, 98, 34, 0.28);

  --shadow: 0 2px 10px rgba(0, 0, 0, 0.32);
}

[dir="rtl"] body { font-family: var(--font-ar); }

@media (prefers-reduced-motion: reduce) {

    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;

/* ==========================================================================
   M<>S | History of Technology — Core Editorial Stylesheet (css/style.css)
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }
html { font-size: 16px; overflow-x: hidden; scroll-behavior: smooth; }
body {
  margin: 0;
  background-color: var(--bg-page);
  color: var(--text-main);
  font-family: var(--font-en);
  line-height: 1.62;
  overflow-x: hidden;
  transition: background-color 0.2s ease, color 0.2s ease;
}
button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
svg { max-width: 100%; height: auto; display: block; }

/* Brand Logo M<>S */
.ms-logo { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; }
.ms-mark {
  display: inline-flex; align-items: center; gap: 1px;
  padding: 5px 10px;
  background-color: #4A5D3B;
  color: #FCFBF8;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 0.96rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.ms-mark span { color: #D8D3C6; }
.ms-sub { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); display: none; }

/* Navigation */
.topbar {
  position: sticky; top: 0; z-index: 100; height: var(--nav-h);
  background-color: var(--bg-surface);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1200px; margin: 0 auto; height: 100%; padding: 0 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.nav-links { display: none; align-items: center; gap: 2px; }
.nav-link {
  padding: 7px 10px; border-radius: 4px; font-size: 0.86rem; font-weight: 600;
  color: var(--text-muted); white-space: nowrap;
  transition: background-color 0.15s ease, color 0.15s ease;
}
.nav-link:hover { background-color: var(--bg-beige); color: var(--text-main); }
.nav-link.active { background-color: #4A5D3B; color: #FCFBF8; }

.topbar-ctrls { display: flex; align-items: center; gap: 6px; }
.ctrl-btn {
  min-height: 36px; padding: 6px 10px; border-radius: 4px;
  background-color: var(--bg-beige); border: 1px solid var(--border);
  font-size: 0.82rem; font-weight: 700; color: var(--text-main);
}
.ctrl-btn:hover { border-color: var(--olive); }

.mobile-drawer {
  display: none; background-color: var(--bg-surface);
  border-bottom: 1px solid var(--border); padding: 12px 16px 16px;
}
.mobile-drawer.open { display: block; }
.mobile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.mobile-drawer .nav-link { display: block; border: 1px solid var(--border); padding: 10px 12px; }

/* Main Wrap */
.container { max-width: 1200px; margin: 0 auto; padding: 20px 16px 68px; width: 100%; }
.page-head { margin-bottom: 22px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.eyebrow { font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--olive); }
.page-title { margin: 4px 0 6px; font-family: var(--font-serif); font-size: 1.7rem; line-height: 1.25; }
[dir="rtl"] .page-title { font-family: var(--font-ar); }
.page-sub { margin: 0; font-size: 0.94rem; color: var(--text-muted); }

/* Cards, Buttons, Badges */
.card {
  background-color: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
}
.card-beige {
  background-color: var(--bg-beige);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 15px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 40px; padding: 8px 15px; border-radius: 4px;
  font-size: 0.88rem; font-weight: 600; border: 1px solid transparent;
  transition: background-color 0.15s ease, border-color 0.15s ease;
  white-space: nowrap;
}
.btn-primary { background-color: #4A5D3B; color: #FCFBF8; border-color: #4A5D3B; }
.btn-primary:hover { background-color: #3B4B2F; }
.btn-secondary { background-color: var(--bg-surface); color: var(--text-main); border-color: var(--border); }
.btn-secondary:hover { background-color: var(--bg-beige); border-color: var(--olive); }
.btn-danger { background-color: var(--err); color: #FCFBF8; }
.btn-sm { min-height: 32px; padding: 5px 11px; font-size: 0.82rem; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 0.74rem; font-weight: 700; }
.badge-olive { background-color: var(--ok-bg); color: var(--ok); }
.badge-err { background-color: var(--err-bg); color: var(--err); }
.badge-beige { background-color: var(--bg-beige); color: var(--text-muted); border: 1px solid var(--border); }

.input, .select {
  width: 100%; min-height: 40px; padding: 8px 12px;
  background-color: var(--bg-surface); border: 1px solid var(--border);
  border-radius: 4px; color: var(--text-main);
}
.input:focus, .select:focus { outline: 2px solid var(--olive); outline-offset: 1px; }

/* Dashboard */
.hero {
  background-color: var(--bg-surface); border: 1px solid var(--border);
  border-inline-start: 4px solid #4A5D3B; border-radius: var(--radius);
  padding: 22px; margin-bottom: 18px;
  display: flex; flex-direction: column; gap: 14px;
}
.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
.stat-card { background-color: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px; }
.stat-k { font-size: 0.74rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
.stat-v { font-size: 1.5rem; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }

.grid-3 { display: grid; grid-template-columns: 1fr; gap: 14px; }
.grid-2 { display: grid; grid-template-columns: 1fr; gap: 14px; }

.progress-track { width: 100%; height: 8px; background-color: var(--bg-beige); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background-color: #4A5D3B; transition: width 0.3s ease; }
[data-theme="dark"] .progress-fill { background-color: var(--olive); }

/* Tabs & Study Cards */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.tab {
  padding: 7px 12px; border-radius: 4px; background-color: var(--bg-surface);
  border: 1px solid var(--border); font-size: 0.84rem; font-weight: 600; color: var(--text-muted);
}
.tab.active { background-color: #4A5D3B; color: #FCFBF8; border-color: #4A5D3B; }

.qa-card {
  background-color: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
}
.qa-ans {
  margin-top: 12px; padding: 14px; background-color: var(--bg-beige);
  border-inline-start: 3px solid var(--olive); border-radius: 4px;
  white-space: pre-line; font-size: 0.94rem;
}
.qa-ar {
  margin-top: 10px; padding: 14px; background-color: var(--bg-page);
  border: 1px solid var(--border); border-radius: 4px;
  direction: rtl; text-align: right; font-family: var(--font-ar);
  white-space: pre-line; font-size: 0.94rem;
}

/* Tables */
.table-wrap { width: 100%; overflow-x: auto; margin-top: 12px; border: 1px solid var(--border); border-radius: 4px; }
.table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
.table th, .table td { padding: 9px 11px; text-align: start; border-bottom: 1px solid var(--border); }
.table th { background-color: var(--bg-beige); font-weight: 700; }

/* Flashcards */
.flash-box {
  max-width: 680px; margin: 0 auto 16px; min-height: 240px;
  background-color: var(--bg-surface); border: 1px solid var(--border);
  border-top: 4px solid #4A5D3B; border-radius: var(--radius);
  padding: 26px 22px; display: flex; flex-direction: column;
  justify-content: center; gap: 12px; cursor: pointer;
}

/* Instant Quiz & Practice Options */
.opt-list { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; }
.opt-btn {
  display: flex; align-items: flex-start; gap: 10px; width: 100%;
  padding: 13px 14px; text-align: start; background-color: var(--bg-beige);
  border: 1px solid var(--border); border-radius: 4px; font-size: 0.93rem;
}
.opt-btn:hover:not(:disabled) { border-color: var(--olive); }
.opt-btn.ok { border-color: var(--ok); background-color: var(--ok-bg); font-weight: 700; }
.opt-btn.err { border-color: var(--err); background-color: var(--err-bg); }
.opt-key {
  min-width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 4px; background-color: var(--bg-surface); border: 1px solid var(--border);
  font-weight: 700; font-size: 0.8rem; flex-shrink: 0;
}

.fb-banner { margin-top: 14px; padding: 13px 15px; border-radius: 4px; border: 1px solid var(--border); font-size: 0.9rem; }
.fb-banner.ok { background-color: var(--ok-bg); border-color: var(--ok); }
.fb-banner.err { background-color: var(--err-bg); border-color: var(--err); }

/* Arrange-in-Order & Matching */
.order-item {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 11px 14px; background-color: var(--bg-beige); border: 1px solid var(--border);
  border-radius: 4px; margin-bottom: 8px;
}
.order-item.ok { background-color: var(--ok-bg); border-color: var(--ok); }
.order-item.err { background-color: var(--err-bg); border-color: var(--err); }

.match-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 12px; }
.match-btn {
  width: 100%; padding: 11px 12px; text-align: start; background-color: var(--bg-beige);
  border: 1px solid var(--border); border-radius: 4px; margin-bottom: 8px; font-size: 0.89rem;
}
.match-btn.picking { border: 2px solid #4A5D3B; background-color: var(--olive-soft); }
.match-btn.paired { background-color: var(--bg-surface); border-color: var(--olive); }
.match-btn.ok { background-color: var(--ok-bg); border-color: var(--ok); }
.match-btn.err { background-color: var(--err-bg); border-color: var(--err); }

/* Modal & Toast & Empty */
.modal-bg {
  position: fixed; inset: 0; background: rgba(24, 25, 23, 0.58);
  display: none; align-items: center; justify-content: center; padding: 16px; z-index: 200;
}
.modal-bg.open { display: flex; }
.modal-box { background-color: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius); max-width: 440px; width: 100%; padding: 22px; }
.toast {
  position: fixed; bottom: 20px; inset-inline-end: 20px; z-index: 300;
  background-color: #1F211E; color: #FCFBF8; padding: 10px 16px; border-radius: 4px;
  border-inline-start: 4px solid #8FA67B; font-size: 0.86rem; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
}
.toast.show { opacity: 1; }
.empty-box { text-align: center; padding: 26px 16px; background-color: var(--bg-beige); border: 1px dashed var(--border); border-radius: var(--radius); color: var(--text-muted); }

.spa-view { display: none; }
.spa-view.active { display: block; }

/* ==========================================================================
   M<>S | History of Technology — Responsive Breakpoints (css/responsive.css)
   ========================================================================== */

@media (min-width: 640px) {
  .ms-sub { display: inline; }
  .match-grid { grid-template-columns: 1fr 1fr; }
}

@media (min-width: 768px) {
  .container { padding: 26px 24px 72px; }
  .page-title { font-size: 1.95rem; }
  .hero { flex-direction: row; align-items: center; justify-content: space-between; padding: 26px; }
  .stats-grid { grid-template-columns: repeat(5, 1fr); }
  .grid-2 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
}

@media (min-width: 1024px) {
  .nav-links { display: flex; }
  .mobile-menu-btn, .mobile-drawer { display: none !important; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 390px) {
  .topbar-inner { padding: 0 10px; gap: 6px; }
  .ctrl-btn { padding: 5px 8px; font-size: 0.76rem; }
  .mobile-grid { grid-template-columns: 1fr; }
  .card, .qa-card { padding: 14px; }
}

  </style>

/* ==========================================================================
   M<>S | History of Technology — LocalStorage Engine (js/storage.js)
   ========================================================================== */

window.MSHOT_STORAGE = (function () {
  var KEY = 'ms_history_tech_v1';
  var mem = null;

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function defaults() {
    var prefersDark = false;
    try { prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
    return {
      lang: 'en',
      theme: prefersDark ? 'dark' : 'light',
      themeSaved: false,
      lastSection: 's1',
      understood: [],      /* array of Q ids */
      favorites: [],       /* array of Q ids */
      flashStatus: {},     /* qId -> 'know' | 'practice' | 'review' */
      quizHistory: [],     /* array of { ts, section, total, correct, wrong, pct } */
      mistakes: {},        /* qId -> { wrongCount, lastWrong, resolved } */
      answeredIds: {},     /* qId -> { correct, wrong } */
      streak: 0,
      lastDate: ''
    };
  }

  function load() {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (!raw) return defaults();
      return Object.assign(defaults(), JSON.parse(raw));
    } catch (e) {
      return mem ? Object.assign(defaults(), mem) : defaults();
    }
  }

  function save(st) {
    mem = st;
    try { window.localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
  }

  function touchStreak(st) {
    var t = todayStr();
    if (st.lastDate === t) return;
    if (st.lastDate) {
      var diff = Math.round((new Date(t + 'T00:00:00') - new Date(st.lastDate + 'T00:00:00')) / 86400000);
      st.streak = diff === 1 ? (st.streak || 0) + 1 : 1;
    } else {
      st.streak = 1;
    }
    st.lastDate = t;
  }

  function update(fn) {
    var st = load();
    fn(st);
    save(st);
    return st;
  }

  function recordQuizAnswer(qId, isCorrect, chosenText) {
    return update(function (st) {
      touchStreak(st);
      var a = st.answeredIds[qId] || { correct: 0, wrong: 0 };
      if (isCorrect) {
        a.correct += 1;
        if (st.mistakes[qId]) st.mistakes[qId].resolved = true;
      } else {
        a.wrong += 1;
        var m = st.mistakes[qId] || { wrongCount: 0, lastWrong: '', resolved: false };
        m.wrongCount += 1;
        m.lastWrong = String(chosenText || '—');
        m.resolved = false;
        st.mistakes[qId] = m;
      }
      st.answeredIds[qId] = a;
    });
  }

  function resetAll() {
    var d = defaults();
    save(d);
    return d;
  }

  return {
    KEY: KEY,
    load: load,
    save: save,
    update: update,
    touchStreak: touchStreak,
    recordQuizAnswer: recordQuizAnswer,
    resetAll: resetAll
  };
})();

window.MSHOT_I18N = (function () {

/* ==========================================================================
   M<>S | History of Technology — Memorization Flashcards (js/flashcards.js)
   Randomized order, English front/back, separate Arabic toggle, repeat difficult.
   ========================================================================== */

window.MSHOT_FLASHCARDS = (function () {
  var deck = [];
  var idx = 0;
  var flipped = false;
  var showArabic = false;
  var difficultOnly = false;

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function rebuild() {
    var st = window.MSHOT_STORAGE.load().flashStatus || {};
    var pool = window.MSHOT_DATA.qa.slice();
    if (difficultOnly) {
      pool = pool.filter(function (q) { return st[q.id] === 'practice' || st[q.id] === 'review'; });
    }
    deck = shuffle(pool);
    idx = 0;
    flipped = false;
    showArabic = false;
  }

  function ensure() { if (!deck.length && !difficultOnly) rebuild(); }

  return {
    getState: function () {
      ensure();
      var st = window.MSHOT_STORAGE.load().flashStatus || {};
      var cur = deck[idx] || null;
      return {
        current: cur,
        index: idx,
        total: deck.length,
        flipped: flipped,
        showArabic: showArabic,
        difficultOnly: difficultOnly,
        status: cur ? (st[cur.id] || '') : ''
      };
    },
    flip: function () { flipped = !flipped; },
    toggleArabic: function () { showArabic = !showArabic; },
    next: function () { if (idx < deck.length - 1) { idx++; flipped = false; showArabic = false; } },
    prev: function () { if (idx > 0) { idx--; flipped = false; showArabic = false; } },
    shuffleDeck: function () { rebuild(); },
    toggleDifficultOnly: function () { difficultOnly = !difficultOnly; rebuild(); },
    mark: function (val) {
      var cur = deck[idx];
      if (!cur) return;
      window.MSHOT_STORAGE.update(function (s) {
        window.MSHOT_STORAGE.touchStreak(s);
        s.flashStatus[cur.id] = val;
      });
      if (idx < deck.length - 1) { idx++; flipped = false; showArabic = false; }
    }
  };
})();

/* ==========================================================================
   M<>S | History of Technology — Instant-Feedback Quiz Engine (js/quiz.js)
   CRITICAL: Immediate verification on click, locked answer after selection,
   randomized questions & shuffled options with accurate correct mapping.
   ========================================================================== */

window.MSHOT_QUIZ = (function () {
  var session = null;

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function shuffleOptions(q) {
    var indexed = q.opts.map(function (text, i) { return { text: text, ok: i === q.correct }; });
    var sh = shuffle(indexed);
    return Object.assign({}, q, {
      opts: sh.map(function (x) { return x.text; }),
      correct: sh.findIndex(function (x) { return x.ok; })
    });
  }

  function start(cfg) {
    var pool = window.MSHOT_DATA.quizBank.filter(function (q) {
      if (cfg.onlyIds) return cfg.onlyIds.indexOf(q.id) !== -1;
      if (cfg.section && cfg.section !== 'all' && q.section !== cfg.section) return false;
      return true;
    });
    if (!pool.length) return null;

    var chosen = shuffle(pool).slice(0, Math.min(cfg.count || 10, pool.length)).map(shuffleOptions);
    session = {
      cfg: Object.assign({}, cfg),
      questions: chosen,
      index: 0,
      locked: {},     /* qId -> { picked, isCorrect } */
      score: 0,
      wrongIds: [],
      finished: false
    };
    return session;
  }

  /* Instant Evaluation — no Submit button required, locks question immediately */
  function selectOption(optIdx) {
    if (!session || session.finished) return null;
    var q = session.questions[session.index];
    if (!q || session.locked[q.id]) return null; /* Prevent changing answer repeatedly */

    var isCorrect = Number(optIdx) === Number(q.correct);
    session.locked[q.id] = { picked: Number(optIdx), isCorrect: isCorrect };
    if (isCorrect) session.score += 1;
    else session.wrongIds.push(q.id);

    window.MSHOT_STORAGE.recordQuizAnswer(q.id, isCorrect, q.opts[optIdx]);
    return session.locked[q.id];
  }

  function next() {
    if (!session) return;
    if (session.index < session.questions.length - 1) {
      session.index += 1;
    } else if (!session.finished) {
      session.finished = true;
      var total = session.questions.length;
      var pct = total ? Math.round((session.score / total) * 100) : 0;
      window.MSHOT_STORAGE.update(function (s) {
        s.quizHistory.unshift({
          ts: Date.now(),
          section: session.cfg.section || 'all',
          total: total,
          correct: session.score,
          wrong: total - session.score,
          pct: pct
        });
      });
    }
  }

  return {
    shuffleOptions: shuffleOptions,
    start: start,
    selectOption: selectOption,
    next: next,
    getSession: function () { return session; },
    clear: function () { session = null; }
  };
})();

   M<>S | History of Technology — Smart Practice Engine (js/practice.js)
   7 Practice Methods:
   1. Q&A Recall | 2. MCQ | 3. True/False | 4. Fill in Blank
   5. Match Terms | 6. Arrange in Order (5 PDF sequences) | 7. Wrong Answers
   ========================================================================== */

window.MSHOT_PRACTICE = (function () {
  var mode = 'qa';
  var idx = 0;
  var revealed = false;
  var currentFeedback = null;
  var shuffledMcq = null;
  var matchSetIdx = 0;
  var matchDefs = [];
  var matchPickedTerm = null;
  var matchPairs = {};
  var matchValidated = false;
  var orderSetIdx = 0;
  var orderWorking = [];
  var orderChecked = false;

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function initMatch() {
    var set = window.MSHOT_DATA.matchSets[matchSetIdx];
    matchDefs = shuffle(set.pairs.map(function (p) { return { id: p.id, def: p.def }; }));
    matchPickedTerm = null;
    matchPairs = {};
    matchValidated = false;
  }

  function initOrder() {
    var set = window.MSHOT_DATA.orderSets[orderSetIdx];
    orderWorking = shuffle(set.items);
    if (orderWorking.join('|') === set.items.join('|') && orderWorking.length > 1) {
      var tmp = orderWorking[0]; orderWorking[0] = orderWorking[1]; orderWorking[1] = tmp;
    }
    orderChecked = false;
  }

  function initMcq() {
    var bank = window.MSHOT_DATA.quizBank;
    shuffledMcq = window.MSHOT_QUIZ.shuffleOptions(bank[idx % bank.length]);
  }

  function setMode(m) {
    mode = m;
    idx = 0;
    revealed = false;
    currentFeedback = null;
    if (m === 'mcq') initMcq();
    if (m === 'match') initMatch();
    if (m === 'order') initOrder();
  }

  function norm(s) { return String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); }

  return {
    getState: function () {
      if (mode === 'mcq' && !shuffledMcq) initMcq();
      if (mode === 'match' && !matchDefs.length) initMatch();
      if (mode === 'order' && !orderWorking.length) initOrder();
      return {
        mode: mode, idx: idx, revealed: revealed, feedback: currentFeedback,
        mcqItem: shuffledMcq,
        matchSet: window.MSHOT_DATA.matchSets[matchSetIdx],
        matchSetIdx: matchSetIdx,
        matchDefs: matchDefs, matchPickedTerm: matchPickedTerm, matchPairs: matchPairs, matchValidated: matchValidated,
        orderSet: window.MSHOT_DATA.orderSets[orderSetIdx],
        orderSetIdx: orderSetIdx,
        orderWorking: orderWorking, orderChecked: orderChecked
      };
    },
    setMode: setMode,
    toggleReveal: function () { revealed = !revealed; },
    nextItem: function () {
      idx += 1;
      revealed = false;
      currentFeedback = null;
      if (mode === 'mcq') initMcq();
    },
    checkMcq: function (optIdx) {
      if (!shuffledMcq || currentFeedback) return;
      var ok = Number(optIdx) === Number(shuffledMcq.correct);
      currentFeedback = { ok: ok, picked: Number(optIdx), exp: shuffledMcq.exp };
      window.MSHOT_STORAGE.recordQuizAnswer(shuffledMcq.id, ok, shuffledMcq.opts[optIdx]);
    },
    checkTf: function (val) {
      var item = window.MSHOT_DATA.tfBank[idx % window.MSHOT_DATA.tfBank.length];
      var ok = Boolean(val) === Boolean(item.ans);
      currentFeedback = { ok: ok, picked: val, exp: item.exp };
      window.MSHOT_STORAGE.recordQuizAnswer(item.id, ok, String(val));
    },
    checkFill: function (txt) {
      var item = window.MSHOT_DATA.fillBank[idx % window.MSHOT_DATA.fillBank.length];
      var ok = item.ans.some(function (a) { return norm(a) === norm(txt); });
      currentFeedback = { ok: ok, display: item.display, exp: item.exp };
      window.MSHOT_STORAGE.recordQuizAnswer(item.id, ok, txt);
    },
    pickMatchTerm: function (tid) { if (!matchValidated) matchPickedTerm = tid; },
    pickMatchDef: function (did) {
      if (matchValidated || !matchPickedTerm) return;
      Object.keys(matchPairs).forEach(function (k) { if (matchPairs[k] === did) delete matchPairs[k]; });
      matchPairs[matchPickedTerm] = did;
      matchPickedTerm = null;
    },
    validateMatch: function () { matchValidated = true; },
    switchMatchSet: function (i) { matchSetIdx = i; initMatch(); },
    moveOrder: function (pos, dir) {
      if (orderChecked) return;
      var target = pos + dir;
      if (target < 0 || target >= orderWorking.length) return;
      var tmp = orderWorking[pos]; orderWorking[pos] = orderWorking[target]; orderWorking[target] = tmp;
    },
    checkOrder: function () { orderChecked = true; },
    switchOrderSet: function (i) { orderSetIdx = i; initOrder(); }
  };
})();

    }

    if (sess.finished) {
      var tot = sess.questions.length;
      var pct = Math.round((sess.score / Math.max(1, tot)) * 100);
      root.innerHTML =
        '<div class="card">' +
          '<div class="eyebrow">' + t('quizComplete') + '</div>' +
          '<h2 class="page-title">' + sess.score + ' / ' + tot + ' (' + pct + '%)</h2>' +
          '<p class="page-sub">' + t('correctAns') + ': ' + sess.score + ' · ' + t('wrongAns') + ': ' + (tot - sess.score) + '</p>' +
          '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;">' +
            (sess.wrongIds.length ? '<button class="btn btn-primary" id="qz-retry-w">' + t('retryWrong') + ' (' + sess.wrongIds.length + ')</button>' : '') +
            '<button class="btn btn-secondary" id="qz-retake">' + t('retakeQuiz') + '</button>' +
          '</div>' +
        '</div>';
      var rw = document.getElementById('qz-retry-w');
      if (rw) rw.addEventListener('click', function () { window.MSHOT_QUIZ.start({ onlyIds: sess.wrongIds, count: sess.wrongIds.length }); renderQuiz(); });
      document.getElementById('qz-retake').addEventListener('click', function () { window.MSHOT_QUIZ.clear(); renderQuiz(); });
      return;
    }

    var q = sess.questions[sess.index];
    var lk = sess.locked[q.id];
    var pctBar = Math.round(((sess.index + (lk ? 1 : 0)) / sess.questions.length) * 100);

    root.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
        '<strong>Q ' + (sess.index + 1) + ' / ' + sess.questions.length + '</strong>' +
        '<span class="badge badge-olive">' + t('correctAns') + ': ' + sess.score + '</span>' +
      '</div>' +
      '<div class="progress-track" style="margin-bottom:16px;"><div class="progress-fill" style="width:' + pctBar + '%;"></div></div>' +
      '<div class="card">' +
        '<span class="badge badge-beige">' + q.section.toUpperCase() + '</span>' +
        '<h2 style="margin:10px 0 4px;font-size:1.12rem;">' + esc(q.q) + '</h2>' +
        (lang === 'ar' ? '<p style="margin:0 0 8px;font-size:0.88rem;color:var(--text-muted);">' + esc(q.qAr) + '</p>' : '') +
        '<div class="opt-list">' + q.opts.map(function (opt, oi) {
          var cls = '';
          if (lk) {
            if (oi === q.correct) cls = ' ok';
            else if (oi === lk.picked) cls = ' err';
          }
          return '<button class="opt-btn' + cls + '" data-qz-opt="' + oi + '" ' + (lk ? 'disabled' : '') + '>' +
            '<span class="opt-key">' + String.fromCharCode(65 + oi) + '</span><span>' + esc(opt) + '</span></button>';
        }).join('') + '</div>' +
        (lk ? '<div class="fb-banner ' + (lk.isCorrect ? 'ok' : 'err') + '">' +
          '<strong>' + (lk.isCorrect ? t('correctMsg') : t('wrongMsg')) + '</strong>' +
          '<div style="margin-top:6px;">' + esc(q.exp) + '</div>' +
        '</div>' +
        '<div style="margin-top:16px;display:flex;justify-content:flex-end;">' +
          '<button class="btn btn-primary" id="qz-next">' + (sess.index < sess.questions.length - 1 ? t('nextQuestion') + ' &rarr;' : t('seeResults')) + '</button>' +
        '</div>' : '') +
      '</div>';

    root.querySelectorAll('[data-qz-opt]').forEach(function (b) {
      b.addEventListener('click', function () {
        window.MSHOT_QUIZ.selectOption(Number(b.getAttribute('data-qz-opt')));
        renderQuiz();
      });
    });
    var nb = document.getElementById('qz-next');
    if (nb) nb.addEventListener('click', function () { window.MSHOT_QUIZ.next(); renderQuiz(); });
  }

  /* ==================== F. SMART PRACTICE (7 MODES) ==================== */
  function renderPractice() {
    var root = document.getElementById('page-practice');
    if (!root) return;
    var t = window.MSHOT_I18N.t, lang = window.MSHOT_I18N.getLang();
    var p = window.MSHOT_PRACTICE.getState();

    var modes = [
      ['qa', t('pmQa')], ['mcq', t('pmMcq')], ['tf', t('pmTf')], ['fill', t('pmFill')],
      ['match', t('pmMatch')], ['order', t('pmOrder')], ['wrong', t('pmWrong')]
    ];

    var body = '';
    if (p.mode === 'qa') {
      var qa = window.MSHOT_DATA.qa[p.idx % window.MSHOT_DATA.qa.length];
      body = '<div class="card"><span class="badge badge-beige">' + qa.page + '</span>' +
        '<h3 style="margin:10px 0;">' + esc(qa.question_en) + '</h3>' +
        (p.revealed ? '<div class="qa-ans">' + esc(qa.answer_en) + '</div><div class="qa-ar">' + esc(qa.explanation_ar) + '</div>' : '') +
        '<div style="display:flex;gap:8px;margin-top:14px;"><button class="btn btn-secondary" id="pm-rev">' + t('revealAnswer') + '</button><button class="btn btn-primary" id="pm-next">' + t('nextItem') + ' &rarr;</button></div></div>';
    } else if (p.mode === 'mcq') {
      var m = p.mcqItem;
      body = '<div class="card"><h3 style="margin:0 0 8px;">' + esc(m.q) + '</h3><div class="opt-list">' +
        m.opts.map(function (o, oi) {
          var cls = p.feedback ? (oi === m.correct ? ' ok' : (oi === p.feedback.picked ? ' err' : '')) : '';
          return '<button class="opt-btn' + cls + '" data-pm-mcq="' + oi + '" ' + (p.feedback ? 'disabled' : '') + '><span class="opt-key">' + String.fromCharCode(65 + oi) + '</span><span>' + esc(o) + '</span></button>';
        }).join('') + '</div>' +
        (p.feedback ? '<div class="fb-banner ' + (p.feedback.ok ? 'ok' : 'err') + '">' + esc(p.feedback.exp) + '</div><div style="margin-top:12px;"><button class="btn btn-primary" id="pm-next">' + t('nextItem') + ' &rarr;</button></div>' : '') + '</div>';
    } else if (p.mode === 'tf') {
      var tf = window.MSHOT_DATA.tfBank[p.idx % window.MSHOT_DATA.tfBank.length];
      body = '<div class="card"><h3 style="margin:0 0 12px;">' + esc(tf.q) + '</h3>' +
        '<div style="display:flex;gap:10px;"><button class="btn btn-secondary" data-pm-tf="true" ' + (p.feedback ? 'disabled' : '') + '>True</button><button class="btn btn-secondary" data-pm-tf="false" ' + (p.feedback ? 'disabled' : '') + '>False</button></div>' +
        (p.feedback ? '<div class="fb-banner ' + (p.feedback.ok ? 'ok' : 'err') + '"><strong>' + (p.feedback.ok ? t('correctMsg') : t('wrongMsg')) + '</strong><div>' + esc(p.feedback.exp) + '</div></div><div style="margin-top:12px;"><button class="btn btn-primary" id="pm-next">' + t('nextItem') + ' &rarr;</button></div>' : '') + '</div>';
    } else if (p.mode === 'fill') {
      var fb = window.MSHOT_DATA.fillBank[p.idx % window.MSHOT_DATA.fillBank.length];
      body = '<div class="card"><h3 style="margin:0 0 12px;">' + esc(fb.q) + '</h3>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;"><input id="pm-fill-inp" class="input" style="max-width:300px;" placeholder="' + esc(t('typePlaceholder')) + '"><button class="btn btn-primary" id="pm-fill-chk">' + t('checkAnswer') + '</button></div>' +
        (p.feedback ? '<div class="fb-banner ' + (p.feedback.ok ? 'ok' : 'err') + '"><strong>' + (p.feedback.ok ? t('correctMsg') : 'Answer: ' + esc(p.feedback.display)) + '</strong><div>' + esc(p.feedback.exp) + '</div></div><div style="margin-top:12px;"><button class="btn btn-primary" id="pm-next">' + t('nextItem') + ' &rarr;</button></div>' : '') + '</div>';
    } else if (p.mode === 'match') {
      var ms = p.matchSet;
      body = '<div class="card">' +
        '<div class="tabs">' + window.MSHOT_DATA.matchSets.map(function (s, i) { return '<button class="tab ' + (i === p.matchSetIdx ? 'active' : '') + '" data-mset="' + i + '">' + esc(lang === 'ar' ? s.titleAr : s.titleEn) + '</button>'; }).join('') + '</div>' +
        '<div class="match-grid"><div>' + ms.pairs.map(function (pr, i) {
          var cls = 'match-btn' + (p.matchPickedTerm === pr.id ? ' picking' : '') + (p.matchValidated ? (p.matchPairs[pr.id] === pr.id ? ' ok' : ' err') : (p.matchPairs[pr.id] ? ' paired' : ''));
          return '<button class="' + cls + '" data-mt="' + pr.id + '">' + (i + 1) + '. ' + esc(pr.term) + '</button>';
        }).join('') + '</div><div>' + p.matchDefs.map(function (df, i) {
          var assigned = Object.keys(p.matchPairs).find(function (k) { return p.matchPairs[k] === df.id; });
          var cls = 'match-btn' + (p.matchValidated ? (assigned === df.id ? ' ok' : ' err') : (assigned ? ' paired' : ''));
          return '<button class="' + cls + '" data-md="' + df.id + '">#' + (i + 1) + ' ' + esc(df.def) + '</button>';
        }).join('') + '</div></div>' +
        '<div style="display:flex;gap:8px;margin-top:12px;"><button class="btn btn-primary btn-sm" id="pm-mval">' + t('validateMatches') + '</button><button class="btn btn-secondary btn-sm" id="pm-mrst">' + t('resetMatches') + '</button></div></div>';
    } else if (p.mode === 'order') {
      var os = p.orderSet;
      body = '<div class="card">' +
        '<div class="tabs">' + window.MSHOT_DATA.orderSets.map(function (s, i) { return '<button class="tab ' + (i === p.orderSetIdx ? 'active' : '') + '" data-oset="' + i + '">' + esc(lang === 'ar' ? s.titleAr : s.titleEn) + '</button>'; }).join('') + '</div>' +
        p.orderWorking.map(function (item, i) {
          var cls = 'order-item' + (p.orderChecked ? (item === os.items[i] ? ' ok' : ' err') : '');
          return '<div class="' + cls + '"><span><strong>' + (i + 1) + '.</strong> ' + esc(item) + '</span>' +
            '<div style="display:flex;gap:4px;"><button class="btn btn-secondary btn-sm" data-oup="' + i + '" ' + (i === 0 || p.orderChecked ? 'disabled' : '') + '>&uarr;</button>' +
            '<button class="btn btn-secondary btn-sm" data-odn="' + i + '" ' + (i === p.orderWorking.length - 1 || p.orderChecked ? 'disabled' : '') + '>&darr;</button></div></div>';
        }).join('') +
        '<div style="display:flex;gap:8px;margin-top:12px;"><button class="btn btn-primary btn-sm" id="pm-ochk">' + t('checkOrder') + '</button><button class="btn btn-secondary btn-sm" id="pm-orst">' + t('resetMatches') + '</button></div></div>';
    } else if (p.mode === 'wrong') {
      var st = window.MSHOT_STORAGE.load();
      var wIds = Object.keys(st.mistakes || {}).filter(function (k) { return !st.mistakes[k].resolved; });
      body = wIds.length
        ? '<div class="card"><p style="margin:0 0 12px;">' + wIds.length + ' ' + t('statWrong') + '</p><button class="btn btn-primary" id="pm-run-wrong">' + t('retryWrong') + '</button></div>'
        : '<div class="empty-box">' + t('emptyHere') + '</div>';
    }

    root.innerHTML =
      '<div class="page-head">' +
        '<div class="eyebrow">M&lt;&gt;S · ' + t('navPractice') + '</div>' +
        '<h1 class="page-title">' + t('practiceTitle') + '</h1>' +
        '<p class="page-sub">' + t('practiceSub') + '</p>' +
      '</div>' +
      '<div class="tabs">' + modes.map(function (m) { return '<button class="tab ' + (p.mode === m[0] ? 'active' : '') + '" data-pmode="' + m[0] + '">' + esc(m[1]) + '</button>'; }).join('') + '</div>' +
      body;

    root.querySelectorAll('[data-pmode]').forEach(function (b) { b.addEventListener('click', function () { window.MSHOT_PRACTICE.setMode(b.getAttribute('data-pmode')); renderPractice(); }); });
    var rv = document.getElementById('pm-rev'); if (rv) rv.addEventListener('click', function () { window.MSHOT_PRACTICE.toggleReveal(); renderPractice(); });
    var nx = document.getElementById('pm-next'); if (nx) nx.addEventListener('click', function () { window.MSHOT_PRACTICE.nextItem(); renderPractice(); });
    root.querySelectorAll('[data-pm-mcq]').forEach(function (b) { b.addEventListener('click', function () { window.MSHOT_PRACTICE.checkMcq(Number(b.getAttribute('data-pm-mcq'))); renderPractice(); }); });
    root.querySelectorAll('[data-pm-tf]').forEach(function (b) { b.addEventListener('click', function () { window.MSHOT_PRACTICE.checkTf(b.getAttribute('data-pm-tf') === 'true'); renderPractice(); }); });
    var fc = document.getElementById('pm-fill-chk'); if (fc) fc.addEventListener('click', function () { window.MSHOT_PRACTICE.checkFill(document.getElementById('pm-fill-inp').value); renderPractice(); });
    root.querySelectorAll('[data-mset]').forEach(function (b) { b.addEventListener('click', function () { window.MSHOT_PRACTICE.switchMatchSet(Number(b.getAttribute('data-mset'))); renderPractice(); }); });
    root.querySelectorAll('[data-mt]').forEach(function (b) { b.addEventListener('click', function () { window.MSHOT_PRACTICE.pickMatchTerm(b.getAttribute('data-mt')); renderPractice(); }); });
    root.querySelectorAll('[data-md]').forEach(function (b) { b.addEventListener('click', function () { window.MSHOT_PRACTICE.pickMatchDef(b.getAttribute('data-md')); renderPractice(); }); });
    var mv = document.getElementById('pm-mval'); if (mv) mv.addEventListener('click', function () { window.MSHOT_PRACTICE.validateMatch(); renderPractice(); });
    var mr = document.getElementById('pm-mrst'); if (mr) mr.addEventListener('click', function () { window.MSHOT_PRACTICE.switchMatchSet(p.matchSetIdx); renderPractice(); });
    root.querySelectorAll('[data-oset]').forEach(function (b) { b.addEventListener('click', function () { window.MSHOT_PRACTICE.switchOrderSet(Number(b.getAttribute('data-oset'))); renderPractice(); }); });
    root.querySelectorAll('[data-oup]').forEach(function (b) { b.addEventListener('click', function () { window.MSHOT_PRACTICE.moveOrder(Number(b.getAttribute('data-oup')), -1); renderPractice(); }); });
    root.querySelectorAll('[data-odn]').forEach(function (b) { b.addEventListener('click', function () { window.MSHOT_PRACTICE.moveOrder(Number(b.getAttribute('data-odn')), 1); renderPractice(); }); });
    var oc = document.getElementById('pm-ochk'); if (oc) oc.addEventListener('click', function () { window.MSHOT_PRACTICE.checkOrder(); renderPractice(); });
    var orst = document.getElementById('pm-orst'); if (orst) orst.addEventListener('click', function () { window.MSHOT_PRACTICE.switchOrderSet(p.orderSetIdx); renderPractice(); });
    var rw = document.getElementById('pm-run-wrong');
    if (rw) rw.addEventListener('click', function () {
      var st = window.MSHOT_STORAGE.load();
      var ids = Object.keys(st.mistakes || {}).filter(function (k) { return !st.mistakes[k].resolved && k.indexOf('qz-') === 0; });
      if (ids.length) { window.MSHOT_QUIZ.start({ onlyIds: ids, count: ids.length }); go('quiz'); }
      else toast('No quiz MCQs in mistakes yet.');
    });
  }

  /* ==================== G. QUICK REVISION SHEET (p. 14) ==================== */
  function renderRevision() {
    var root = document.getElementById('page-revision');
    if (!root) return;
    var t = window.MSHOT_I18N.t, rev = window.MSHOT_DATA.revision;

    root.innerHTML =
      '<div class="page-head">' +
        '<div class="eyebrow">PDF Page 14 · Quick Revision Sheet</div>' +
        '<h1 class="page-title">' + t('revisionTitle') + '</h1>' +
        '<p class="page-sub">' + t('revisionSub') + '</p>' +
      '</div>' +

      '<div class="card" style="margin-bottom:18px;">' +
        '<h2 style="margin:0 0 10px;font-size:1.1rem;">Original Quick Revision Sheet (p. 14)</h2>' +
        '<ul style="margin:0 0 14px;padding-inline-start:20px;">' + rev.sheetBullets.map(function (b) { return '<li style="margin-bottom:6px;">' + esc(b) + '</li>'; }).join('') + '</ul>' +
        '<div class="qa-ans"><strong>Golden Rule:</strong> ' + esc(rev.goldenRuleEn) + '</div>' +
        '<div class="qa-ar">' + esc(rev.goldenRuleAr) + '</div>' +
      '</div>' +

      '<div class="grid-2">' +
        '<div class="card"><h3 style="margin:0 0 10px;">Important Historical Dates</h3>' + renderTable({ headers: ['Year', 'Milestone'], rows: rev.dates }) + '</div>' +
        '<div class="card"><h3 style="margin:0 0 10px;">Key Inventors & Pioneers</h3>' + renderTable({ headers: ['Inventor', 'Contribution'], rows: rev.inventors }) +
          '<h3 style="margin:18px 0 10px;">Frequently Confused Concepts</h3>' + renderTable({ headers: ['Pair', 'Difference'], rows: rev.confused }) + '</div>' +
      '</div>' +
      '<div class="card" style="margin-top:16px;"><h3 style="margin:0 0 10px;">Technical Abbreviations</h3>' + renderTable({ headers: ['Abbreviation', 'Meaning'], rows: rev.abbreviations }) + '</div>';
  }

  /* ==================== H. PROGRESS & PERFORMANCE ==================== */
  function renderProgress() {
    var root = document.getElementById('page-progress');
    if (!root) return;
    var t = window.MSHOT_I18N.t, lang = window.MSHOT_I18N.getLang(), st = window.MSHOT_STORAGE.load();
    var totalQ = window.MSHOT_DATA.qa.length;
    var und = (st.understood || []).length;
    var ansC = 0, ansW = 0;
    Object.keys(st.answeredIds || {}).forEach(function (k) { ansC += st.answeredIds[k].correct; ansW += st.answeredIds[k].wrong; });
    var favs = (st.favorites || []).map(function (id) { return window.MSHOT_DATA.qa.find(function (q) { return q.id === id; }); }).filter(Boolean);
    var revs = Object.keys(st.mistakes || {}).filter(function (k) { return !st.mistakes[k].resolved; });

    root.innerHTML =
      '<div class="page-head">' +
        '<div class="eyebrow">M&lt;&gt;S · ' + t('navProgress') + '</div>' +
        '<h1 class="page-title">' + t('progressTitle') + '</h1>' +
        '<p class="page-sub">' + t('progressSub') + '</p>' +
      '</div>' +

      '<section class="stats-grid">' +
        '<div class="stat-card"><div class="stat-k">' + t('totalQs') + '</div><div class="stat-v">' + totalQ + '</div></div>' +
        '<div class="stat-card"><div class="stat-k">' + t('statCompleted') + '</div><div class="stat-v">' + und + '</div></div>' +
        '<div class="stat-card"><div class="stat-k">' + t('correctAns') + '</div><div class="stat-v">' + ansC + '</div></div>' +
        '<div class="stat-card"><div class="stat-k">' + t('wrongAns') + '</div><div class="stat-v">' + ansW + '</div></div>' +
        '<div class="stat-card"><div class="stat-k">' + t('statOverall') + '</div><div class="stat-v">' + Math.round((und / totalQ) * 100) + '%</div></div>' +
      '</section>' +

      '<div class="grid-2">' +
        '<div class="card"><h3 style="margin:0 0 12px;">' + t('mostDifficult') + '</h3>' +
          window.MSHOT_DATA.sections.map(function (sec) {
            var qs = window.MSHOT_DATA.qa.filter(function (q) { return q.section === sec.id; });
            var d = qs.filter(function (q) { return (st.understood || []).indexOf(q.id) !== -1; }).length;
            var pct = Math.round((d / qs.length) * 100);
            return '<div style="margin-bottom:12px;"><div style="display:flex;justify-content:space-between;font-size:0.86rem;font-weight:600;margin-bottom:4px;"><span>' + esc(lang === 'ar' ? sec.titleAr : sec.titleEn) + '</span><span>' + pct + '%</span></div>' +
              '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%;"></div></div></div>';
          }).join('') +
          '<div style="margin-top:16px;"><button class="btn btn-danger btn-sm" id="btn-open-reset">' + t('resetProgress') + '</button></div>' +
        '</div>' +

        '<div class="card"><h3 style="margin:0 0 10px;">' + t('favQuestions') + ' (' + favs.length + ')</h3>' +
          (favs.length ? favs.map(function (q) { return '<div class="card-beige" style="margin-bottom:8px;font-size:0.88rem;"><strong>' + esc(q.question_en) + '</strong></div>'; }).join('') : '<div class="empty-box">' + t('emptyHere') + '</div>') +
          '<h3 style="margin:16px 0 10px;">' + t('needsRevQs') + ' (' + revs.length + ')</h3>' +
          (revs.length ? revs.map(function (id) {
            var item = window.MSHOT_DATA.quizBank.find(function (x) { return x.id === id; }) || window.MSHOT_DATA.tfBank.find(function (x) { return x.id === id; }) || window.MSHOT_DATA.fillBank.find(function (x) { return x.id === id; });
            return item ? '<div class="card-beige" style="margin-bottom:8px;font-size:0.88rem;">' + esc(item.q) + '</div>' : '';
          }).join('') : '<div class="empty-box">' + t('emptyHere') + '</div>') +
        '</div>' +
      '</div>';

    document.getElementById('btn-open-reset').addEventListener('click', function () {
      document.getElementById('reset-modal').classList.add('open');
    });
  }

  function renderCurrent() {
    syncChrome();
    if (ui.page === 'home') renderHome();
    else if (ui.page === 'study') renderStudy();
    else if (ui.page === 'understanding') renderUnderstanding();
    else if (ui.page === 'flashcards') renderFlashcards();
    else if (ui.page === 'quiz') renderQuiz();
    else if (ui.page === 'practice') renderPractice();
    else if (ui.page === 'revision') renderRevision();
    else if (ui.page === 'progress') renderProgress();
  }

  function init() {
    var st = window.MSHOT_STORAGE.load();
    window.MSHOT_I18N.apply(st.lang || 'en');
    document.documentElement.setAttribute('data-theme', st.theme || 'light');

    ui.page = document.body.getAttribute('data-page') || 'home';
    var params = new URLSearchParams(window.location.search);
    if (params.get('sec')) ui.section = params.get('sec');
    else ui.section = st.lastSection || 's1';

    document.querySelectorAll('[data-nav]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        if (isSpa()) { e.preventDefault(); go(el.getAttribute('data-nav')); }
      });
    });

    var mb = document.getElementById('btn-mobile');
    if (mb) mb.addEventListener('click', function () { document.getElementById('mobile-drawer').classList.toggle('open'); });
    document.getElementById('btn-lang').addEventListener('click', function () { window.MSHOT_I18N.toggle(); renderCurrent(); });
    document.getElementById('btn-theme').addEventListener('click', function () {
      var nxt = (window.MSHOT_STORAGE.load().theme || 'light') === 'light' ? 'dark' : 'light';
      window.MSHOT_STORAGE.update(function (s) { s.theme = nxt; s.themeSaved = true; });
      document.documentElement.setAttribute('data-theme', nxt);
      syncChrome();
    });

    var rc = document.getElementById('reset-cancel');
    if (rc) rc.addEventListener('click', function () { document.getElementById('reset-modal').classList.remove('open'); });
    var rok = document.getElementById('reset-confirm');
    if (rok) rok.addEventListener('click', function () {
      document.getElementById('reset-modal').classList.remove('open');
      window.MSHOT_STORAGE.resetAll();
      window.MSHOT_QUIZ.clear();
      renderCurrent();
      toast('Progress reset.');
    });

    renderCurrent();
  }

  document.addEventListener('DOMContentLoaded', init);
  return { go: go, renderCurrent: renderCurrent };
})();

  </script>
</body>
</html>
